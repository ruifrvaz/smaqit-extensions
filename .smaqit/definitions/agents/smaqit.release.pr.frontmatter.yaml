# Per-platform metadata for agents/smaqit.release.pr.agent.md.
# Copilot and Claude render YAML frontmatter; Codex renders standalone TOML.
#
# Note: the Copilot side declares no `tools:` at all — it relies on the
# GitHub Copilot Coding Agent's implicit `report_progress` primitive for
# commits/pushes, which has no Claude Code equivalent. The Claude side
# instead gets direct Bash access to run `git`/`gh` itself, matching how
# smaqit-release-local already operates.
copilot:
  name: smaqit.release.pr
  description: Orchestrate a release process via pull request (CI/CD, Coding Agent)
  metadata:
    version: "0.5.0"

claude:
  name: smaqit-release-pr
  description: Orchestrate a release process via pull request (CI/CD) — uses direct git and gh CLI access via Bash, since Claude Code has no equivalent of Copilot's report_progress commit API
  tools: Bash, Read, Edit, Grep, Glob, TodoWrite

codex:
  name: smaqit.release.pr
  description: Orchestrate a release process via pull request using direct git and gh CLI access

placeholders:
  PR_EXECUTION_CONTEXT:
    copilot: GitHub Copilot Coding Agent triggered by an issue
    claude: Claude Code operating on a pull-request branch
    codex: Codex operating on a pull-request branch
  PR_PUSH_METHOD:
    copilot: the `report_progress` tool
    claude: direct `git push` using the current environment's git/gh credentials
    codex: direct `git push` using the current environment's git/gh credentials
