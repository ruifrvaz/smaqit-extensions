name: Sync Verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'scripts/generate-targets.py'
      - '.smaqit/definitions/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.codex/agents/**'
      - '.agents/skills/**'
      - 'Makefile'

jobs:
  verify-sync:
    name: Verify .github/ in sync with source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Regenerate dogfooding targets
        run: |
          make sync

      - name: Verify generated mirrors are committed
        run: |
          SYNC_STATUS="$(git status --short -- .github/agents .github/skills .codex/agents .agents/skills)"
          if [ -n "$SYNC_STATUS" ]; then
            echo "❌ Dogfooding mirrors are out of sync:"
            echo "$SYNC_STATUS"
            echo ""
            echo "Run 'make sync' and commit the generated mirrors."
            exit 1
          fi
          echo "✅ Copilot and Codex dogfooding mirrors are in sync"
